<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公共管理后台</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/01.css">
    <link rel="stylesheet" href="./css/02.css">
</head>
<body>
    <div class="admin-page">
        <!-- 左部分 -->
        <div class="admin-page__sidebar">
            <!-- logo -->
            <div class="sidebar">
                <div class="sidebar__logo">
                    <img src="./images/面性购物袋.png">
                </div>
                <div class="sidebar__txt">FlexAdmin</div>
                <div class="admin-page--v2">v2.1</div>
            </div>
            <!-- 菜单 -->
             <div class="sidebar1">
                <div class="sidebar__group">
                    <div class="sidebar__group-title">总览</div>
                    <div class="sidebar__menu">
                        <span class="sidebar-emojiall">📊</span>
                        <span class="sidebar__text">数据看板</span>
                    </div>
                    <div class="sidebar__menu-item">
                        <span class="sidebar-emojiall">📈</span>
                        <span class="sidebar__text1">数据统计</span>
                    </div>
                </div>
                <div class="sidebar__group">
                    <div class="sidebar__group-title">商城管理</div>
                    <div class="sidebar__menu-item">
                        <span class="sidebar-emojiall">📦️</span>
                        <span class="sidebar__text1">商品管理</span>
                        <div id="sidebar__badge">128</div>
                    </div>
                    <div class="sidebar__menu-item">
                        <span class="sidebar-emojiall">🛒</span>
                        <span class="sidebar__text1">订单管理</span>
                        <div id="sidebar__badge1">12</div>
                    </div>
                    <div class="sidebar__menu-item">
                        <span class="sidebar-emojiall">🏷️</span>
                        <span class="sidebar__text1">营销中心</span>
                    </div>
                    <div class="sidebar__menu-item">
                        <span class="sidebar-emojiall">💬</span>
                        <span class="sidebar__text1">评论管理</span>
                    </div>
                </div>
                <div class="class="sidebar__group"">
                    <div class="sidebar__group-title">用户与设置</div>
                    <div class="sidebar__menu-item">
                        <span class="sidebar-emojiall">👥</span>
                        <span class="sidebar__text1">会员管理</span>
                    </div>
                    <div class="sidebar__menu-item">
                        <span class="sidebar-emojiall">🧩</span>
                        <span class="sidebar__text1">权限管理</span>
                    </div>
                    <div class="sidebar__menu-item">
                        <span class="sidebar-emojiall">⚙️</span>
                        <span class="sidebar__text1">系统设置</span>
                    </div>
                </div>
             </div>
             <!-- 管理员 -->
             <div class="admin__welcome">
                <div class="admin__avatar">
                    <div class="admin__emojiall">👨‍💼</div>
                </div>
                <div class="admin__info">
                    <div class="admin__info-title">欢迎回来，管理员</div>
                    <div class="admin__info-email">admin@flexshop.com</div>
                </div>
             </div>
        </div>

        <!-- 右部分 -->
        <div class="admin-page__main">
            <div></div>
        </div>
    </div>
</body>
</html>
