<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/player-left.css">
    <link rel="stylesheet" href="./css/player-right.css">
</head>
<body>
    <div class="big-box">
        <div class="big-box-left">
            <!-- 左边布局一 -->
            <div class="box-left-top">
                <div class="box-left">
                    <div class="music-logo">
                    <img src="./images/音乐.png">
                    </div>
                    <div class="music-txt">FlexMusic</div>
                </div>
                <div class="music-txt1">客户端</div>
            </div>
            <!-- 左边布局二 -->
            <div class="music-collect">
                <div class="music-logo1">
                    <img src="./images/头戴式耳机.png">
                </div>
                <div>
                    <div class="collect-txt">Flex  私藏歌单</div>
                    <div class="playlist-info">8首·约36分钟·每日更新</div>
                </div>
            </div>
            <!-- 左边布局三 -->
             <div class-="song-list">
                <div class="song-list-header">
                    <span>歌曲</span>
                    <span>时长</span>
                </div>
                <div class="song-item">
                    <div class="box">
                        <div class="song-left">
                            <div class="playing-icon">
                                <img src="./images/信号.png">
                            </div>
                            <div class="song-info">
                                <div class="song-name">晴天</div>
                                <div class="song-singer-album">周杰伦·叶惠美</div>
                            </div>
                        </div>  
                        <div class="song-right">
                            <div class="song-duration">04.29</div>
                            <div class="song-fav-btn">
                                <img src="./images/爱心.png">
                            </div>
                        </div>
                    </div>
                    <div class="box1">
                        <div class="song-left">
                            <div class="song-list1">2</div>
                            <div class="song-info">
                                <div class="song-name1">消愁</div>
                                <div class="song-singer-album">毛不易·平凡的一天</div>
                            </div>
                        </div>  
                        <div class="song-right">
                            <div class="song-duration">04.16</div>
                            <div class="song-fav-btn">
                                <img src="./images/空爱心.png">
                            </div>
                        </div>
                    </div>
                    <div class="box1">
                        <div class="song-left">
                            <div class="song-list1">3</div>
                            <div class="song-info">
                                <div class="song-name1">光年之外</div>
                                <div class="song-singer-album">邓紫棋·光年之外</div>
                            </div>
                        </div>  
                        <div class="song-right">
                            <div class="song-duration">03.55</div>
                            <div class="song-fav-btn">
                                <img src="./images/爱心.png">
                            </div>
                        </div>
                    </div>
                    <div class="box1">
                        <div class="song-left">
                            <div class="song-list1">4</div>
                            <div class="song-info">
                                <div class="song-name1">平凡之路</div>
                                <div class="song-singer-album">朴树·猎户星座</div>
                            </div>
                        </div>  
                        <div class="song-right">
                            <div class="song-duration">05.01</div>
                            <div class="song-fav-btn">
                                <img src="./images/空爱心.png">
                            </div>
                        </div>
                    </div>
                    <div class="box1">
                        <div class="song-left">
                            <div class="song-list1">5</div>
                            <div class="song-info">
                                <div class="song-name1">起风了</div>
                                <div class="song-singer-album">卖辣椒也用券·起风了</div>
                            </div>
                        </div>  
                        <div class="song-right">
                            <div class="song-duration">05.13</div>
                            <div class="song-fav-btn">
                                <img src="./images/爱心.png">
                            </div>
                        </div>
                    </div>
                    <div class="box1">
                        <div class="song-left">
                            <div class="song-list1">6</div>
                            <div class="song-info">
                                <div class="song-name1">南山南</div>
                                <div class="song-singer-album">马頔・南山南</div>
                            </div>
                        </div>  
                        <div class="song-right">
                            <div class="song-duration">04.30</div>
                            <div class="song-fav-btn">
                                <img src="./images/空爱心.png">
                            </div>
                        </div>
                    </div>
                    <div class="box1">
                        <div class="song-left">
                            <div class="song-list1">7</div>
                            <div class="song-info">
                                <div class="song-name1">夜空中最亮的星</div>
                                <div class="song-singer-album">逃跑计划・世界</div>
                            </div>
                        </div>  
                        <div class="song-right">
                            <div class="song-duration">04.12</div>
                            <div class="song-fav-btn">
                                <img src="./images/空爱心.png">
                            </div>
                        </div>
                    </div>
                    <div class="box1">
                        <div class="song-left">
                            <div class="song-list1">8</div>
                            <div class="song-info">
                                <div class="song-name1">成都</div>
                                <div class="song-singer-album">赵雷・无法长大</div>
                            </div>
                        </div>  
                        <div class="song-right">
                            <div class="song-duration">05.28</div>
                            <div class="song-fav-btn">
                                <img src="./images/空爱心.png">
                            </div>
                        </div>
                    </div>
                </div>
             </div>
             <!-- 左边布局四 -->
            <div class="play-all-btn-box">
                <div class="play-all-btn">
                    <div class="play-icon">
                        <img src="./images/暂停按钮.png">
                    </div>
                    <div class="play-all-text">播放全部  (8)</div>
                </div>
            </div>
        </div>
        <!-- 右半部分 -->
        <div class="big-box-right">
            <div class="player-page">
                <div class="player-cover-box">
                    <div class="player-cover-box1">
                        <img src="./images/音乐.png">
                    </div>
                </div>
                <div class="song-name2">晴天</div>
                <div class="song-info1">周杰伦·专辑《叶惠美》</div>
                <div class="song-quality-tags">
                    <div class="quality-tag1">无损</div>
                    <div class="quality-tag2">SQ</div>
                    <div class="quality-tag3">Hi-Res</div>
                </div>
            </div>
            <div class="player">
                <!-- 进度条 -->
                <div class="player__progress-wrap">
                    <span class="player__time-current">02:32</span>
                    <div class="player__progress-bar">
                        <div class="player__progress-fill">
                            <div class="player__progress-dot"></div>
                        </div>
                    </div>
                    <span class="player__time-total">04.29</span>
                </div>
                <!-- 按钮控制 -->
                <div class="player__control-wrap">
                    <div class="player__btn-shuffle">🔀</div>
                    <div class="player__btn-prev">
                        <img src="./images/上一曲.png">
                    </div>
                    <div class="player__btn-play">
                        <img src="./images/开始播放.png">
                    </div>
                    <div class="player__btn-next">
                        <img src="./images/下一曲.png">
                    </div>
                    <div class="player__btn-loop">🔁</div>
                </div>
                <!-- 音量 -->
                <div class="player__progress-wrap">
                    <div class="player__icon-volume">
                        <img src="./images/喇叭图标.png">
                    </div>
                    <div class="player__volume-wrap">
                        <div class="player__volume-bar">
                            <div class="player__volume-dot"></div>
                        </div>
                    </div>
                    <div class="player__icon-headphone">
                        <img src="./images/头戴式耳机.png">
                    </div>
                </div>
                <div class="player__next-tip">下一首自动播放:《消愁》——毛不易</div>
            </div>
        </div>
    </div>
</body>
</html>
